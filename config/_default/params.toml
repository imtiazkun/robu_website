[about]
title = "About ROBU"
description = "The Robotics Club of BRAC University (ROBU) is a student organization dedicated to fostering innovation, creativity, and technical excellence in robotics and automation."
mission = "To provide a platform for students to explore robotics, develop technical skills, and contribute to the advancement of technology through hands-on projects and collaborative learning."
features = [
  { title = "Innovation", description = "We encourage creative thinking and innovative solutions to real-world problems." },
  { title = "Learning", description = "Continuous learning through workshops, competitions, and collaborative projects." },
  { title = "Community", description = "Building a strong community of robotics enthusiasts and future engineers." }
]
cta = { text = "Join Our Community", url = "/register" }

[leadership]
title = "Panel"
description = "Meet the dedicated leaders who guide our robotics community and drive innovation forward."
members = [
  { name = "Fardeen Khan", position = "President", description = "The microcontroller of the bot, the mastermind behind every decision, carrying the whole club on his shoulders and guiding it towards a new dawn.", image = "img/panel/2025/1.jpg", social = { linkedin = "https://linkedin.com/in/fardeenkhan", email = "fardeen@robu.edu" } },
  { name = "Ismam Hossain Redwan", position = "Vice President", description = "Second-in-command and the second-brain behind all actions and operations. When the captain is not there, he ensures everything stays right on track.", image = "img/panel/2025/2.jpg", social = { linkedin = "https://linkedin.com/in/ismamredwan", email = "ismam@robu.edu" } },
  { name = "Md Asraful Islam Emon", position = "General Secretary of Administration", description = "With exceptional foresight and experience, supervising all administrative operations as the backbone of ROBU, ensuring internal management and smooth event execution.", image = "img/panel/2025/3.jpg", social = { linkedin = "https://linkedin.com/in/asrafulemon", email = "asraful@robu.edu" } },
  { name = "Maisa Kabir", position = "General Secretary of Operations", description = "Responsible for the soul of ROBU, managing and coordinating projects to ensure the club stays on track towards its goals in robotics innovation.", image = "img/panel/2025/4.jpg", social = { linkedin = "https://linkedin.com/in/maisakabir", email = "maisa@robu.edu" } }
]

[departments]
title = "Departments"
description = "Key departments that run ROBU's operations."
items = [
  { name = "Finance and Marketing Department", abbr = "F&M", description = "The Finance and Marketing Department of the Robotics Club of BRAC University (ROBU) is responsible for managing the club’s financial operations and promoting its activities to both internal and external audiences. The department ensures efficient budgeting, fund allocation, sponsorship and financial transparency while supporting all events, projects, and initiatives through strategic financial planning. On the marketing side, FnM focuses on enhancing ROBU’s brand image, developing promotional campaigns, and maintaining engagement across digital and offline platforms. By integrating financial discipline with creative outreach, the department plays a vital role in sustaining the club’s growth, visibility, and long-term success." },
  { name = "Department of IT", abbr = "IT", description = "The department of IT is the creative powerhouse behind the ROBU's visual storytelling. Our team transforms ROBU’s innovations, projects and achievements into stunning visuals in order to connect with robotics enthusiasts across every platform. From posters and banners to promotional videos, reels, event recaps, and social media campaigns, the IT Department crafts not only content but also the energy and essence of the club. Every piece of design, animation, and video not only showcases ROBU’s projects but also strengthens its identity within the university and beyond. Our work fuels engagement, enthusiasm, and ensures that ROBU’s activities are seen, documented, remembered, and most importantly - celebrated. Whether designing vibrant event graphics, producing captivating highlight videos, or creating cohesive digital campaigns, the department of IT don’t just represent the club; our carry its spirit forward, connecting every member under a shared banner of creativity and innovation." },
  { name = "Editorial and Publications Department", abbr = "E&P", description = "Beyond the circuits and the code, there is a story waiting to be told. We, the Editorial and Publications Department are the chroniclers of innovation and the architects of its narrative. We don't just write; we sculpt ideas into compelling articles that stand as monuments to our progress. We are the bridge between the machine and the mind, illuminating the purpose behind every project and the vision that drives our future. Through our words, we give Robu its voice, its memory, and its legacy. We are the story of Robu, written for the world." },
  { name = "Research and Project Management Department", abbr = "RPM", description = "The Research and Project Management (RPM) Department of the Robotics Club of BRAC University (ROBU) is dedicated to fostering innovation and guiding members in developing impactful robotics projects. Our core responsibilities include overseeing research initiatives, managing technical and creative projects across ROBU. We strive to inspire members to pursue independent research and contribute original ideas that advance the field of robotics. Through project supervision, technical support, and organizing workshops, RPM ensures that every member’s creativity is nurtured and their innovations are effectively realized." },
  { name = "Event Management", abbr = "EM", description = "The Event Management Department of the Robotics Club of BRAC University - ROBU is responsible for organizing and executing all club events, including workshops, seminars, competitions, and promotional activities. Our primary goal is to ensure the success of every event by efficiently managing logistics, scheduling, budgeting, and interdepartmental communication. We collaborate not only with other ROBU teams but also with various clubs and organizations to create engaging and impactful experiences that showcase the club’s innovation and technical achievements. Through effective coordination and teamwork, the Event Management Department upholds professionalism, creativity, and excellence in every activity while strengthening ROBU’s presence within and beyond the university." },
  { name = "Strategic Planning Department", abbr = "SP", description = "The Strategic Planning department serves as the backbone of the club. Here, your ideas spark the future of our robotics club. We play a key role in shaping the future and oversee ongoing activities of ROBU. Besides planning, we also actively maintain collaboration between other departments of the club for projects and activities. As a member, you’ll dive into brainstorming creative strategies, coordinating with other departments, and turning big ideas into reality. We value fresh perspectives, enthusiasm, and teamwork, whether you’re organizing a project or planning a workshop." },
  { name = "Human Resources Department", abbr = "HR", description = "The Human Resources Department of the Robotics Club of BRAC University (ROBU) serves as the central body for managing the club’s most valuable asset- its members. The department’s core purpose is to ensure effective inter-departmental communication, uphold organizational harmony, and foster a professional and engaging environment within ROBU. Key functions include developing and enforcing club policies, maintaining member databases, and coordinating with all departments to ensure smooth operations. Major activities involve member recruitment, onboarding, and continuous engagement through motivational initiatives and performance evaluation. The HR Department also plays a vital role in conflict resolution, feedback collection, and providing administrative and logistical support during club events. Additionally, it takes initiatives to enhance leadership and teamwork skills through interactive sessions, surveys, and internal workshops, ensuring members’ personal and professional growth. By promoting inclusivity, accountability, and a culture of continuous improvement, the department strengthens ROBU’s internal structure and long-term sustainability. Through strategic communication, data-driven management, and a people-focused approach, the Human Resources Department contributes significantly to sustaining a cohesive, efficient, and growth-oriented culture across ROBU." }
]
